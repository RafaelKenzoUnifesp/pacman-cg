<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #topBorder {
            position: absolute;
            border: 3px solid #ffd200;
            pointer-events: none;
            background: radial-gradient(
                circle,
                rgba(0, 0, 0, 0) 32%,
                rgba(0, 0, 0, 0.82) 56%,
                #000000 68%
            );
        }

        #hud {
            position: absolute;
            left: 16px;
            bottom: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 16px;
            border: 1px solid #1919a6;
            pointer-events: none;
            z-index: 2;
        }

        #hud.game-over,
        #hud.game-won {
            left: 50%;
            bottom: 50%;
            min-width: 360px;
            max-width: calc(100vw - 32px);
            padding: 24px 30px;
            transform: translate(-50%, 50%);
            text-align: center;
            line-height: 1.8;
            font-size: 21px;
            background: rgba(0, 0, 0, 0.92);
        }

        #hud.game-over {
            border: 2px solid #ff3030;
        }

        #hud.game-won {
            border: 2px solid #ffd200;
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <div id="topBorder"></div>

    <div id="hud">PONTUAÇÃO: 0</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="transformacoes.js"></script>
    <script src="maze.js"></script>
    <script src="sceneObject.js"></script>
    <script src="ghostHouse.js"></script>
    <script src="cereja.js"></script>
    <script src="fantasma.js"></script>
    <script src="camera.js"></script>
    <script src="renderer.js"></script>
    <script src="gameplay.js"></script>
    <script src="scene.js"></script>
    <script src="main.js"></script>

</body>

</html>
